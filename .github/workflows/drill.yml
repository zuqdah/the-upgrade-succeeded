name: Drill

# Manual only. This builds an AKS cluster, upgrades two node pools under load
# and tears everything down -- about an hour and roughly forty cents -- and
# none of that should happen because a branch moved.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: drill
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.16.3"
  # Terraform signs itself in with GitHub OIDC and asks for a fresh token
  # whenever it needs one, so a long apply cannot outlive its credentials.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_resource_group_name: rg-aksupgrade-lab

jobs:
  drill:
    name: Build, upgrade twice under load, tear down
    runs-on: ubuntu-latest
    environment: lab
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Mask identifiers
        run: |
          echo "::add-mask::${{ secrets.AZURE_TENANT_ID }}"
          echo "::add-mask::${{ secrets.AZURE_CLIENT_ID }}"
          echo "::add-mask::${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # The wrapper swallows exit codes into outputs; the pass script reads
          # Terraform's exit code as evidence, so it must be the real one.
          terraform_wrapper: false

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl, kubelogin and the YAML module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $HOME 'bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          az aks install-cli --install-location (Join-Path $bin 'kubectl') --kubelogin-install-location (Join-Path $bin 'kubelogin') --only-show-errors
          if ($LASTEXITCODE) { throw 'az aks install-cli failed.' }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module powershell-yaml -MinimumVersion 0.4.7 -Force

      # Without state from a previous run, a cluster left behind would make
      # the apply fail half an hour in with "already exists". Say so now.
      - name: Check nothing is left from an earlier run
        run: |
          set -euo pipefail
          left=$(az aks list --resource-group "$TF_VAR_resource_group_name" --query "length(@)" -o tsv)
          if [ "$left" != "0" ]; then
            echo "A cluster from an earlier run is still in $TF_VAR_resource_group_name. Run Destroy first." >&2
            exit 1
          fi

      - name: Choose the versions to upgrade between
        id: versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./module/UpgradeDrill/UpgradeDrill.psm1
          $location = az group show --name $env:TF_VAR_resource_group_name --query location -o tsv
          $catalog = (az aks get-versions --location $location -o json) -join "`n" | ConvertFrom-Json
          $pick = Select-UpgradeVersion -Catalog $catalog
          Write-Host "Upgrading $($pick.From) -> $($pick.To): $($pick.Reason)"
          "from=$($pick.From)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "to=$($pick.To)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The API server and the app's load balancer both accept this address
      # and nothing else, for the hour they exist.
      - name: Find the runner address
        id: ip
        run: |
          set -euo pipefail
          addr=$(curl -sS --fail https://api.ipify.org)
          echo "::add-mask::$addr"
          echo "addr=$addr" >> "$GITHUB_OUTPUT"

      - name: Build the cluster
        id: apply
        env:
          TF_VAR_kubernetes_version: ${{ steps.versions.outputs.to }}
          TF_VAR_runner_ip: ${{ steps.ip.outputs.addr }}
        run: |
          set -euo pipefail
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -input=false -auto-approve
          {
            echo "cluster=$(terraform -chdir=infra output -raw cluster_name)"
            echo "nodes_rg=$(terraform -chdir=infra output -raw node_resource_group)"
          } >> "$GITHUB_OUTPUT"

      - name: Connect kubectl
        run: |
          set -euo pipefail
          az aks get-credentials --resource-group "$TF_VAR_resource_group_name" \
            --name "${{ steps.apply.outputs.cluster }}" --overwrite-existing --only-show-errors
          kubelogin convert-kubeconfig -l azurecli
          # Azure RBAC role assignments reach the API server a little after
          # the cluster exists. Wait for access rather than failing the pass.
          for i in $(seq 1 30); do
            if kubectl get nodes >/dev/null 2>&1; then kubectl get nodes -o wide; exit 0; fi
            echo "  not authorised yet (check $i)"; sleep 10
          done
          kubectl get nodes
          exit 1

      - name: Refresh the Azure CLI sign-in
        run: ./scripts/az-login.sh

      - name: Pass 1 -- unprotected
        shell: pwsh
        env:
          TF_VAR_kubernetes_version: ${{ steps.versions.outputs.to }}
          TF_VAR_runner_ip: ${{ steps.ip.outputs.addr }}
        run: >-
          ./scripts/Invoke-UpgradePass.ps1 -Pass unprotected
          -FromVersion '${{ steps.versions.outputs.from }}' -ToVersion '${{ steps.versions.outputs.to }}'
          -RunnerIp '${{ steps.ip.outputs.addr }}' -ResourceGroup $env:TF_VAR_resource_group_name
          -ClusterName '${{ steps.apply.outputs.cluster }}'

      - name: Refresh the Azure CLI sign-in
        if: always() && steps.apply.outcome == 'success'
        run: ./scripts/az-login.sh

      - name: Pass 2 -- protected
        if: always() && steps.apply.outcome == 'success'
        shell: pwsh
        env:
          TF_VAR_kubernetes_version: ${{ steps.versions.outputs.to }}
          TF_VAR_runner_ip: ${{ steps.ip.outputs.addr }}
        run: >-
          ./scripts/Invoke-UpgradePass.ps1 -Pass protected
          -FromVersion '${{ steps.versions.outputs.from }}' -ToVersion '${{ steps.versions.outputs.to }}'
          -RunnerIp '${{ steps.ip.outputs.addr }}' -ResourceGroup $env:TF_VAR_resource_group_name
          -ClusterName '${{ steps.apply.outputs.cluster }}'

      - name: Grade
        if: always() && steps.apply.outcome == 'success'
        shell: pwsh
        run: ./scripts/Measure-Drill.ps1 -EvidenceDirectory out -ReportPath out/drill-report.json

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: drill-evidence
          path: |
            out/*.json
            out/*.ndjson
          if-no-files-found: warn

      # A cluster with three or four nodes bills about nine dollars a day, so
      # the teardown runs whether or not anything above succeeded.
      - name: Refresh the Azure CLI sign-in
        if: always()
        run: ./scripts/az-login.sh

      - name: Tear down
        if: always()
        env:
          TF_VAR_kubernetes_version: ${{ steps.versions.outputs.to || '1.0.0' }}
          TF_VAR_runner_ip: ${{ steps.ip.outputs.addr || '127.0.0.1' }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if terraform -chdir=infra destroy -input=false -auto-approve; then exit 0; fi
            echo "destroy attempt $attempt failed; retrying"
            sleep 30
          done
          exit 1

      # Terraform's exit code is a claim about its state file. This checks
      # Azure: no cluster in the lab group, and the node resource group --
      # disks, load balancer, public IPs -- actually gone.
      - name: Confirm nothing is left
        if: always()
        run: ./scripts/Confirm-Teardown.sh
